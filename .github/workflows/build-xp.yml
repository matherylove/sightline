name: Build Sightline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_ARCHIVE_URL: https://github.com/lighterowl/qt563xp/releases/download/1.2/Qt-5.6.3-Static-XP.7z
  QT_ROOT: C:\Qt\5.6.3-Static-XP
  VS2017_PATH: C:\BuildTools2017

jobs:
  sightline:
    name: Sightline.exe
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      BUILD_DIR: ${{ github.workspace }}\build

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Qt
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${env:QT_ARCHIVE_URL}" -OutFile "${env:RUNNER_TEMP}\qt-xp.7z"

      - name: Extract Qt
        shell: pwsh
        run: |
          if (Test-Path "${env:QT_ROOT}") { Remove-Item "${env:QT_ROOT}" -Recurse -Force }
          New-Item -ItemType Directory -Path "C:\Qt" -Force | Out-Null
          & "C:\Program Files\7-Zip\7z.exe" x "${env:RUNNER_TEMP}\qt-xp.7z" "-oC:\Qt" -y
          $qmake = "${env:QT_ROOT}\bin\qmake.exe"
          $spec = "${env:QT_ROOT}\mkspecs\win32-msvc2017\qmake.conf"
          if (-not (Test-Path $qmake)) { throw "qmake.exe was not found at $qmake" }
          if (-not (Test-Path $spec)) { throw "qmake.conf was not found at $spec" }
          & $qmake -v

      - name: Unpack FFmpeg runtime DLLs
        shell: pwsh
        run: |
          $ffmpeg = "${env:GITHUB_WORKSPACE}\third_party\ffmpeg"
          if (-not (Test-Path $ffmpeg)) { throw "third_party\ffmpeg is missing from the checkout" }
          $archives = Get-ChildItem -Path $ffmpeg -Filter *.7z -ErrorAction SilentlyContinue
          foreach ($archive in $archives) {
            Write-Host "Extracting $($archive.Name)"
            & "C:\Program Files\7-Zip\7z.exe" x $archive.FullName "-o$ffmpeg" -y
            if ($LASTEXITCODE -ne 0) { throw "7-Zip failed on $($archive.Name)" }
          }
          $required = @("avcodec-61.dll", "avformat-61.dll", "avutil-59.dll", "swscale-8.dll", "swresample-5.dll")
          $missing = @()
          foreach ($dll in $required) {
            if (-not (Test-Path (Join-Path $ffmpeg $dll))) { $missing += $dll }
          }
          if ($missing.Count -gt 0) { throw "Missing FFmpeg runtime DLLs: $($missing -join ', ')" }
          Get-ChildItem -Path $ffmpeg -Filter *.dll | ForEach-Object { Write-Host "  $($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB" }

      - name: Install Visual Studio 2017 XP build tools
        shell: pwsh
        run: |
          $bootstrapper = "${env:RUNNER_TEMP}\vs_buildtools_2017.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/15/release/vs_buildtools.exe" -OutFile $bootstrapper
          $arguments = @(
            "--quiet",
            "--wait",
            "--norestart",
            "--nocache",
            "--installPath", "${env:VS2017_PATH}",
            "--add", "Microsoft.VisualStudio.Workload.VCTools",
            "--add", "Microsoft.VisualStudio.Component.VC.v141.x86.x64",
            "--add", "Microsoft.VisualStudio.Component.WinXP"
          )
          $process = Start-Process -FilePath $bootstrapper -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "VS 2017 Build Tools installer failed with exit code $($process.ExitCode)" }

      - name: Generate Makefile
        shell: cmd
        run: |
          call "%VS2017_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x86
          if exist "%BUILD_DIR%" rmdir /S /Q "%BUILD_DIR%"
          mkdir "%BUILD_DIR%"
          cd /d "%BUILD_DIR%"
          "%QT_ROOT%\bin\qmake.exe" -spec "%QT_ROOT%\mkspecs\win32-msvc2017" ..\Sightline.pro CONFIG+=release
          if not exist Makefile exit /b 1

      - name: Build
        shell: cmd
        run: |
          call "%VS2017_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x86
          cd /d "%BUILD_DIR%"
          nmake

      - name: Verify XP subsystem version
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "${env:BUILD_DIR}" -Filter Sightline.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Sightline.exe was not produced" }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $major = [BitConverter]::ToUInt16($bytes, $peOffset + 0x48)
          $minor = [BitConverter]::ToUInt16($bytes, $peOffset + 0x4A)
          Write-Host "Subsystem version: $major.$minor"
          if ($major -ne 5 -or $minor -ne 1) { throw "Expected subsystem 5.1 for Windows XP, got $major.$minor" }

      - name: Stage release layout
        shell: pwsh
        run: |
          $stage = "${env:GITHUB_WORKSPACE}\stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $exe = Get-ChildItem -Path "${env:BUILD_DIR}" -Filter Sightline.exe -Recurse | Select-Object -First 1
          Copy-Item $exe.FullName "$stage\Sightline.exe"
          Copy-Item "${env:GITHUB_WORKSPACE}\README.md" "$stage\LEEME.md" -ErrorAction SilentlyContinue
          # The DLLs ride next to the executable. Without them Sightline.exe
          # dies on load with a missing-module box that names avcodec and
          # nothing else, so a build that produced no DLLs must not ship.
          $dlls = Get-ChildItem -Path "${env:GITHUB_WORKSPACE}\third_party\ffmpeg" -Filter *.dll
          if ($dlls.Count -eq 0) { throw "No FFmpeg DLLs to stage" }
          $dlls | ForEach-Object { Copy-Item $_.FullName $stage }
          Write-Host "Staged: $((Get-ChildItem $stage | Measure-Object).Count) files"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Sightline-Windows-XP-x86
          path: stage\**
          if-no-files-found: error
